name: Build Windows Map Forge Desktop

on:
  push:
    branches: [main]
    paths:
      - package.json
      - desktop/**
      - shared/**
      - web/**
      - index.html
      - world/index.html
      - icon-192.png
      - icon-512.png
      - manifest.webmanifest
      - .github/workflows/windows-desktop.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop build dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript
        run: npm run check:desktop
      - name: Test optional terrain generation
        run: npm run test:terrain
      - name: Build Windows installer and portable app
        run: npm run pack:win
      - name: Publish installer and portable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpireWrought-Map-Forge-v3-2-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 90
